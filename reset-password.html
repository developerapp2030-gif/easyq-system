<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور - EASY-Q</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #06372E, #0A4B3D);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    .reset-card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .reset-card h2 {
      color: #06372E;
      margin-bottom: 8px;
    }
    .reset-card p {
      color: #6B7280;
      margin-bottom: 24px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #E5E7EB;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #C6923A;
      box-shadow: 0 0 0 3px rgba(198,146,58,0.2);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #06372E, #0A4B3D);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(6,55,46,0.3);
    }
    .error {
      color: #EF4444;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    .success {
      color: #10B981;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
<div class="reset-card">
  <h2>إعادة تعيين كلمة المرور</h2>
  <p>أدخل كلمة المرور الجديدة</p>
  
  <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة">
  <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">
  
  <button id="updatePasswordBtn">تحديث كلمة المرور</button>
  
  <div id="errorMsg" class="error"></div>
  <div id="successMsg" class="success"></div>
</div>

<script>
  // تعريف supabase مرة واحدة فقط
  const SUPABASE_URL = 'https://zjdfadkonftkgljvzxoy.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqZGZhZGtvbmZ0a2dsanZ6eG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3NTQ3NTQsImV4cCI6MjA4ODMzMDc1NH0.XZaHGtz3PdBh08m2P9ZM7Xsg3tCG4nskzsoc3wPT-_Q';
  const _supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  document.getElementById('updatePasswordBtn').addEventListener('click', async function() {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorDiv = document.getElementById('errorMsg');
    const successDiv = document.getElementById('successMsg');
    
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    
    if (!newPassword || !confirmPassword) {
      errorDiv.textContent = 'الرجاء إدخال كلمة المرور';
      errorDiv.style.display = 'block';
      return;
    }
    
    if (newPassword.length < 8) {
      errorDiv.textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل';
      errorDiv.style.display = 'block';
      return;
    }
    
    if (newPassword !== confirmPassword) {
      errorDiv.textContent = 'كلمتا المرور غير متطابقتين';
      errorDiv.style.display = 'block';
      return;
    }
    
    try {
      const { data, error } = await _supabase.auth.updateUser({ password: newPassword });
      
      if (error) throw error;
      
      successDiv.textContent = '✅ تم تحديث كلمة المرور بنجاح! جاري التحويل...';
      successDiv.style.display = 'block';
      
      setTimeout(() => {
        window.location.href = '/';
      }, 2000);
      
    } catch (err) {
      errorDiv.textContent = '❌ فشل تحديث كلمة المرور: ' + err.message;
      errorDiv.style.display = 'block';
    }
  });
</script>
</body>
</html>
