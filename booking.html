<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>EASY-Q | حجز وانتظار</title>
  
  <!-- PWA Support -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#8B0000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
<!-- Styles -->
<link rel="stylesheet" href="css/booking.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/css/intlTelInput.css">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- App Scripts -->
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/js/intlTelInput.min.js"></script>
<script src="js/booking.js"></script>  
  <style>
    

#audioModal {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    background: rgba(0, 0, 0, 0.85) !important;
    backdrop-filter: blur(8px) !important;
    display: none !important;
    align-items: center !important;
    justify-content: center !important;
    z-index: 20000 !important;
}

#audioModal.show {
    display: flex !important;
}

#audioModal .audio-modal-container {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border-radius: 30px;
    padding: 30px 25px;
    text-align: center;
    width: 85%;
    max-width: 320px;
    direction: rtl;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    border: 1px solid rgba(212,175,55,0.3);
}

#audioModal .audio-modal-icon i {
    font-size: 55px;
    color: #D4AF37;
    margin-bottom: 20px;
}

#audioModal .audio-modal-title {
    color: white;
    margin-bottom: 12px;
    font-size: 22px;
    font-weight: bold;
}

#audioModal .audio-modal-desc {
    color: #aaa;
    margin-bottom: 25px;
    font-size: 14px;
    line-height: 1.6;
    text-align: center;
}

#audioModal .audio-modal-buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
}

#audioModal .audio-modal-btn {
    padding: 12px 25px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    transition: transform 0.2s;
}

#audioModal .audio-modal-btn.enable {
    background: #10B981;
    color: white;
}

#audioModal .audio-modal-btn.disable {
    background: #EF4444;
    color: white;
}

#audioModal .audio-modal-btn:hover {
    transform: scale(1.02);
}

/* مودال استعادة الحجز */
#restoreModal {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    background: rgba(0, 0, 0, 0.7) !important;
    backdrop-filter: blur(4px) !important;
    display: none !important;
    align-items: center !important;
    justify-content: center !important;
    z-index: 10000 !important;
}

#restoreModal.show {
    display: flex !important;
}

/* مودال استعادة الحجز */
#restoreModal {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    background: rgba(0, 0, 0, 0.7) !important;
    backdrop-filter: blur(4px) !important;
    display: none !important;
    align-items: center !important;
    justify-content: center !important;
    z-index: 10000 !important;
}

#restoreModal.show {
    display: flex !important;
}

#restoreModal .modal {
    background: var(--card-bg);
    border-radius: 20px;
    width: 400px;
    max-width: 90vw;
    padding: 24px;
    position: relative;
    margin: 0;
}

/* تحسين العنوان فقط */
#restoreModalTitle {
    text-align: center;
    font-size: 21px;
    font-weight: 900;
    margin-bottom: 8px;
    color: var(--text-primary, inherit);
}

#restoreModalSub {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 16px;
    color: var(--text-secondary, inherit);
    opacity: 0.86;
}

/* تحسين الأزرار فقط */
#restoreViewBtn,
#restoreCloseBtn {
    border-radius: 14px !important;
    min-height: 44px;
    font-weight: 800;
}

#restoreBookingPreview {
    margin-top: 14px;
}

#restoreBookingPreview .restore-preview-found {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.10);
}

#restoreBookingPreview .restore-preview-icon {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--booking-success, #22c55e);
    color: #ffffff;
    font-weight: 900;
    flex: 0 0 28px;
}

#restoreBookingPreview .restore-preview-content {
    width: 100%;
}

#restoreBookingPreview .restore-preview-title {
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 8px;
    color: var(--text-primary, inherit);
}

#restoreBookingPreview .restore-preview-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    padding: 3px 0;
    color: var(--text-secondary, inherit);
}

#restoreBookingPreview .restore-preview-row strong {
    color: var(--text-primary, inherit);
    font-weight: 900;
}

  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- سيتم ملء المحتوى ديناميكياً عبر JavaScript -->
  </div>

<!-- مودال تفعيل التنبيهات -->
<div id="audioModal" class="modal-backdrop">
    <div class="audio-modal-container">
    <div class="audio-modal-icon">
      <i class="fas fa-volume-up"></i>
    </div>
    <div class="audio-modal-title">🔔 تفعيل التنبيهات الصوتية</div>
    <div class="audio-modal-desc">
      يمكنك تفعيل التنبيهات لتصلك إشعارات عند:<br>
      • اقتراب دورك 📢<br>
      • وصول دورك 🎯<br>
      • جاهزية الطاولة 🍽️
    </div>
    <div class="audio-modal-buttons">
      <button class="audio-modal-btn enable" id="enableAudioYes">
        <i class="fas fa-check-circle"></i> نعم، تفعيل
      </button>
      <button class="audio-modal-btn disable" id="enableAudioNo">
        <i class="fas fa-volume-mute"></i> لا، كتم
      </button>
    </div>
  </div>
</div>
  <!-- مودال عرض الحجز -->
<div class="modal-backdrop" id="restoreModal">
  <div class="modal" style="max-width: 400px;">
    <div class="modal-title" id="restoreModalTitle">عرض حجز نشط</div>
    <div class="modal-sub" id="restoreModalSub">أدخل رقم الحجز المرجعي و رقم الجوال</div>

    <input type="text" id="restoreCode" class="form-input" placeholder="رقم الحجز المرجعي (مثال: A4821)" style="margin-bottom: 12px;">
    <div id="restoreModalAndText" style="text-align: center; margin: 10px 0;">و</div>
    <input type="tel" id="restorePhone" class="form-input" placeholder="رقم الجوال (05xxxxxxxx)" maxlength="19">
    <div id="restoreBookingPreview" style="display: none;"></div>

    <div style="display: flex; gap: 12px; margin-top: 20px;">
      <button class="settings-save" id="restoreViewBtn" onclick="viewBooking()" style="flex: 1;">عرض الحجز</button>
      <button class="settings-close" id="restoreCloseBtn" onclick="closeRestoreModal()" style="flex: 1;">إغلاق</button>
    </div>
  </div>
</div>
</body>
</html>
